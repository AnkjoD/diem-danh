networks:
  homura_network:
    driver: bridge

services:
  minio:
    image: minio/minio:latest
    container_name: homura-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - homura_network

  postgres:
    image: postgres:15
    container_name: homura_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
      PGTZ: Asia/Ho_Chi_Minh
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - homura_network

  # pgAdmin tốn ~300MB RAM, chỉ bật khi cần xem database
  # Để bật lại: bỏ dấu # ở các dòng bên dưới, rồi chạy: docker-compose up -d pgadmin
  # pgadmin:
  #   image: dpage/pgadmin4
  #   container_name: homura_pgadmin
  #   restart: always
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
  #     PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
  #   ports:
  #     - "5050:80"
  #   networks:
  #     - homura_network
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

  backend:
    build:
      context: ./backend
      target: development
    container_name: homura-backend
    command: sh -c "npm install && npm run start:dev"
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - backend_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - FASTAPI_URL=${FASTAPI_URL}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - JWT_SECRET=${JWT_SECRET}
      - TZ=Asia/Ho_Chi_Minh
      - AI_SERVICE_URL=http://ai:8000
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000/api/docs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - homura_network

  ai:
    build:
      context: ./ai
      target: development
    container_name: homura-ai
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./ai:/app
      - ai_venv:/opt/venv
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - WATCHPACK_POLLING=true
      - TZ=Asia/Ho_Chi_Minh
    networks:
      - homura_network

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: homura-frontend
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_SERVER_URL=${SERVER_URL}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - homura_network

volumes:
  minio_data:
  postgres_data:
  backend_modules:
  frontend_modules:
  ai_venv:
