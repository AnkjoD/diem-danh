networks:
  homura_network:
    driver: bridge

services:
  minio:
    image: minio/minio:latest
    container_name: homura-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - homura_network

  postgres:
    image: postgres:15
    container_name: homura_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      PGTZ: Asia/Ho_Chi_Minh
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - homura_network

  backend:
    build:
      context: ./backend
      target: production
    container_name: homura-backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - FASTAPI_URL=${FASTAPI_URL}
      - JWT_SECRET=${JWT_SECRET}
      - TZ=Asia/Ho_Chi_Minh
      - AI_SERVICE_URL=http://ai:8000
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4000/api/docs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - homura_network
    restart: always

  ai:
    build:
      context: ./ai
      target: production
    container_name: homura-ai
    ports:
      - "8000:8000"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - TZ=Asia/Ho_Chi_Minh
    networks:
      - homura_network
    restart: always

  frontend:
    build:
      context: ./frontend
      target: production
    container_name: homura-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SERVER_URL=${SERVER_URL}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - homura_network
    restart: always

volumes:
  minio_data:
  postgres_data:
